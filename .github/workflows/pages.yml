name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 404.html
      - static/**
      - CNAME
      - x86_64/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect website files
        run: mkdir public && cp -r index.html 404.html static CNAME x86_64 public/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
